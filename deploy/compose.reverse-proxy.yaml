# Connect an existing HTTPS reverse proxy; this override does not start Caddy.
services:
  app:
    environment:
      NODE_ENV: production
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set the deployment HTTPS origin}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-openai-compatible}
      GITHUB_ENABLED: ${GITHUB_ENABLED:-1}
  worker:
    environment:
      NODE_ENV: production
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set the deployment HTTPS origin}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-openai-compatible}
      GITHUB_ENABLED: ${GITHUB_ENABLED:-1}
