name: crewroom
x-logging: &logging
  driver: local
  options: { max-size: "10m", max-file: "3" }
x-app: &app
  logging: *logging
  build: .
  image: crewroom:0.11.0
  environment: &environment
    NODE_ENV: ${NODE_ENV:-development}
    PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:4180}
    DATABASE_URL_FILE: /run/crewroom-secrets/db_url
    HOST: 0.0.0.0
    PORT: 4180
    DATA_DIR: /data
    MODEL_PROVIDER: ${MODEL_PROVIDER:-openai-compatible}
    MODEL_NAME: ${MODEL_NAME:-}
    MODEL_BASE_URL: ${MODEL_BASE_URL:-}
    MODEL_ENDPOINT_URL: ${MODEL_ENDPOINT_URL:-}
    MODEL_AUTH_HEADER: ${MODEL_AUTH_HEADER:-}
    MODEL_AUTH_SCHEME: ${MODEL_AUTH_SCHEME:-auto}
    MODEL_API_VERSION: ${MODEL_API_VERSION:-2023-06-01}
    EMBEDDING_ENDPOINT_URL: ${EMBEDDING_ENDPOINT_URL:-}
    EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
    EMBEDDING_AUTH_HEADER: ${EMBEDDING_AUTH_HEADER:-}
    EMBEDDING_AUTH_SCHEME: ${EMBEDDING_AUTH_SCHEME:-auto}
    RUNNER_URL: ${RUNNER_URL:-http://runner:4191}
    MODEL_MAX_OUTPUT_TOKENS: ${MODEL_MAX_OUTPUT_TOKENS:-8192}
    MODEL_TIMEOUT_MS: ${MODEL_TIMEOUT_MS:-120000}
    GITHUB_ENABLED: ${GITHUB_ENABLED:-1}
    GITLAB_BASE_URL: ${GITLAB_BASE_URL:-}
    GITLAB_PROJECTS: ${GITLAB_PROJECTS:-}
    GITLAB_SHARED_PROJECTS: ${GITLAB_SHARED_PROJECTS:-}
  read_only: true
  tmpfs: ["/tmp:size=64m,noexec,nosuid"]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
services:
  db:
    logging: *logging
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: crewroom
      POSTGRES_USER: crewroom
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: [database:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U crewroom -d crewroom"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  init-secrets:
    <<: *app
    user: root
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    command: [node, scripts/stage-secrets.mjs]
    secrets:
      [db_url, model_api_key, embedding_api_key, gitlab_token, runner_token]
    volumes:
      [
        "app-secrets:/out/app",
        "worker-secrets:/out/worker",
        "runner-secrets:/out/runner",
      ]
  init-data:
    <<: *app
    user: root
    cap_add: [CHOWN, FOWNER]
    command: [node, scripts/init-volume.mjs]
    volumes: [runtime:/data]
  migrate:
    <<: *app
    command: [node, server/cli.js, migrate]
    volumes: ["app-secrets:/run/crewroom-secrets:ro"]
    depends_on:
      init-secrets: { condition: service_completed_successfully }
      db: { condition: service_healthy }
  app:
    <<: *app
    ports: ["${BIND_ADDRESS:-127.0.0.1}:${PORT:-4180}:4180"]
    volumes: ["app-secrets:/run/crewroom-secrets:ro"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:4180/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  worker:
    <<: *app
    command: [node, server/worker.js]
    environment:
      <<: *environment
      EMBEDDING_API_KEY_FILE: /run/crewroom-secrets/embedding_api_key
      MODEL_API_KEY_FILE: /run/crewroom-secrets/model_api_key
      GITLAB_TOKEN_FILE: /run/crewroom-secrets/gitlab_token
      RUNNER_TOKEN_FILE: /run/crewroom-secrets/runner_token
    volumes: [runtime:/data, "worker-secrets:/run/crewroom-secrets:ro"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      init-data: { condition: service_completed_successfully }
    stop_grace_period: 150s
    restart: unless-stopped
  runner:
    logging: *logging
    build: { context: ., dockerfile: Dockerfile.runner }
    image: crewroom-runner:0.11.0
    environment:
      HOST: 0.0.0.0
      PORT: 4191
      RUNNER_STATE_DIR: /state
      RUNNER_TOKEN_FILE: /run/crewroom-secrets/runner_token
      RUNNER_NAMESPACE: ${COMPOSE_PROJECT_NAME:-crewroom}
      RUNNER_JOB_IMAGE: ${RUNNER_JOB_IMAGE:-crewroom-job:local}
    depends_on:
      init-secrets: { condition: service_completed_successfully }
    volumes:
      [
        "runner-state:/state",
        "runner-secrets:/run/crewroom-secrets:ro",
        "${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock",
      ]
    read_only: true
    tmpfs: ["/tmp:size=256m,nosuid,nodev,noexec"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:4191/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    stop_grace_period: 90s
    restart: unless-stopped
  job-image:
    profiles: [images]
    build: { context: ., dockerfile: Dockerfile.job }
    image: crewroom-job:local
    command: [node, --version]
secrets:
  runner_token:
    { file: "${CREWROOM_SECRETS_DIR:-./.local/secrets}/runner_token" }
  db_url: { file: "${CREWROOM_SECRETS_DIR:-./.local/secrets}/db_url" }
  db_password: { file: "${CREWROOM_SECRETS_DIR:-./.local/secrets}/db_password" }
  gitlab_token:
    { file: "${CREWROOM_SECRETS_DIR:-./.local/secrets}/gitlab_token" }
  embedding_api_key:
    { file: "${CREWROOM_SECRETS_DIR:-./.local/secrets}/embedding_api_key" }
  model_api_key:
    { file: "${CREWROOM_SECRETS_DIR:-./.local/secrets}/model_api_key" }
volumes:
  database:
  runtime:
  runner-state:
  app-secrets:
  worker-secrets:
  runner-secrets:
