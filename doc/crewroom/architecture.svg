<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" role="img" aria-labelledby="title desc">
<title id="title">Crewroom 단일 control plane 아키텍처</title><desc id="desc">Paperclip이 유일한 작업 실행 권한을 소유하고 Crewroom 정책이 context와 발행을 보호한다. EC2 한 대의 Docker app과 PostgreSQL 배포는 실제 지원 기반이며 독립 실행 격리는 후속 완료 조건이다.</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#536779"/></marker>
<symbol id="user" viewBox="0 0 32 32"><circle cx="16" cy="10" r="5"/><path d="M5 29v-4c0-7 22-7 22 0v4"/></symbol>
<symbol id="core" viewBox="0 0 32 32"><rect x="7" y="7" width="18" height="18" rx="3"/><path d="M12 1v6m8-6v6m-8 18v6m8-6v6M1 12h6M1 20h6m18-8h6m-6 8h6"/><rect x="12" y="12" width="8" height="8" rx="1"/></symbol>
<symbol id="shield" viewBox="0 0 32 32"><path d="M16 2L28 7v9c0 7-7 12-12 15C11 28 4 23 4 16V7Z"/><path d="m10 16 4 4 9-10"/></symbol>
<symbol id="terminal" viewBox="0 0 32 32"><rect x="2" y="4" width="28" height="24" rx="4"/><path d="m7 11 5 5-5 5m10 0h8"/></symbol>
<symbol id="db" viewBox="0 0 32 32"><ellipse cx="16" cy="6" rx="13" ry="4"/><path d="M3 6v20c0 6 26 6 26 0V6M3 16c0 6 26 6 26 0"/></symbol>
<symbol id="file" viewBox="0 0 32 32"><path d="M7 2h12l7 7v21H7Z M19 2v8h7M11 16h11M11 22h11"/></symbol>
<symbol id="git" viewBox="0 0 32 32"><circle cx="8" cy="6" r="4"/><circle cx="8" cy="26" r="4"/><circle cx="25" cy="6" r="4"/><path d="M8 10v12m17-12v3c0 7-17 4-17 9"/></symbol>
<style>text{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Arial',sans-serif;fill:#213447}.title{font-size:40px;font-weight:700}.sub{font-size:21px;fill:#607181}.label{font-size:25px;font-weight:700}.body{font-size:20px}.small{font-size:17px;fill:#607181}.pill{font-size:16px;font-weight:700}.line{fill:none;stroke:#536779;stroke-width:3;marker-end:url(#arrow)}.icon{fill:none;stroke:#355f67;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}</style>
</defs>
<rect width="1600" height="1160" fill="#f6f8fa"/>
<text x="55" y="70" class="title">Crewroom · 지속되는 팀 작업, 하나의 실행 권한</text>
<text x="55" y="110" class="sub">기반: Paperclip cff331f6  |  2026-10-28 아키텍처 설계  |  구현·검증 상태는 본문 참조</text>
<rect x="55" y="145" width="1490" height="46" rx="12" fill="#e5edef"/><text x="78" y="175" class="body">제품 UI → 기존 API/인증 → Paperclip task·wake·run·approval → 정책 검사 → 실행 → 검증된 결과</text>
<rect x="55" y="230" width="345" height="225" rx="18" fill="#fff" stroke="#d6e0e5" stroke-width="2"/><use href="#user" x="77" y="254" width="34" height="34" class="icon"/><text x="125" y="279" class="label">Crewroom 제품 화면</text><text x="80" y="321" class="body">단일 팀 · 한국어 desktop</text><text x="80" y="352" class="body">부서 공용 agent + 내 비서</text><text x="80" y="383" class="body">스킬 · 파일 · 작업 · 미미 상태</text><text x="80" y="435" class="pill" fill="#496773">첫 단면 구현 중</text><rect x="465" y="230" width="465" height="225" rx="18" fill="#eaf2f3" stroke="#d6e0e5" stroke-width="2"/><use href="#core" x="487" y="254" width="34" height="34" class="icon"/><text x="535" y="279" class="label">Paperclip · 유일한 권한 주체</text><text x="490" y="321" class="body">identity / authorization / task</text><text x="490" y="352" class="body">wake queue / run / approval / audit</text><text x="490" y="383" class="body">session / workspace exclusive lease</text><text x="490" y="435" class="pill" fill="#496773">UPSTREAM 재사용</text><rect x="465" y="505" width="465" height="215" rx="18" fill="#fff" stroke="#d6e0e5" stroke-width="2"/><use href="#shield" x="487" y="529" width="34" height="34" class="icon"/><text x="535" y="554" class="label">Crewroom 정책 확장</text><text x="490" y="596" class="body">개인·부서 범위와 source revision</text><text x="490" y="627" class="body">실행·resume·tool/file·결과 검사</text><text x="490" y="658" class="body">철회 → 재사용 차단·quarantine</text><text x="490" y="700" class="pill" fill="#496773">privacy 일부 구현 / 나머지 목표</text><rect x="995" y="505" width="550" height="215" rx="18" fill="#fff" stroke="#d6e0e5" stroke-width="2"/><use href="#terminal" x="1017" y="529" width="34" height="34" class="icon"/><text x="1065" y="554" class="label">허용된 runtime / adapter</text><text x="1020" y="596" class="body">기존 Claude harness · custom endpoint</text><text x="1020" y="627" class="body">명시적 cwd / session / stop / resource limit</text><text x="1020" y="658" class="body">목표: job별 파일·네트워크·process 경계</text><text x="1020" y="700" class="pill" fill="#496773">LIVE endpoint·격리 검증 필요</text><rect x="995" y="230" width="550" height="225" rx="18" fill="#fff" stroke="#d6e0e5" stroke-width="2"/><use href="#db" x="1017" y="254" width="34" height="34" class="icon"/><text x="1065" y="279" class="label">일관된 지속 저장</text><text x="1020" y="321" class="body">PostgreSQL: task·ACL·run·승인·manifest</text><text x="1020" y="352" class="body">파일: workspace·home·transcript·snapshot</text><text x="1020" y="383" class="body">checkpoint + hash + policy epoch</text><text x="1020" y="435" class="pill" fill="#496773">DB만 복원하면 재개할 수 없음</text><rect x="995" y="770" width="550" height="190" rx="18" fill="#fff" stroke="#d6e0e5" stroke-width="2"/><use href="#file" x="1017" y="794" width="34" height="34" class="icon"/><text x="1065" y="819" class="label">검증된 산출물</text><text x="1020" y="861" class="body">artifact hash + run + workspace revision</text><text x="1020" y="892" class="body">source dependencies + test evidence</text><text x="1020" y="940" class="pill" fill="#496773">모델의 완료 발언과 분리</text><rect x="465" y="770" width="465" height="190" rx="18" fill="#fff" stroke="#d6e0e5" stroke-width="2"/><use href="#git" x="487" y="794" width="34" height="34" class="icon"/><text x="535" y="819" class="label">GitLab exact publisher</text><text x="490" y="861" class="body">승인된 SHA / title / body만 발행</text><text x="490" y="892" class="body">server secret · Draft MR · remote receipt</text><text x="490" y="940" class="pill" fill="#496773">목표 / LIVE 발행 검증 전</text><path d="M400 340H455" class="line"/><path d="M697 455V495" class="line"/><path d="M930 612H985" class="line"/><path d="M1270 505V465" class="line"/><path d="M1545 344H1570V751H1270V760" class="line"/><path d="M995 862H940" class="line"/>
<text x="1050" y="488" class="small">context · session · files</text>
<path d="M930 314H985" class="line" stroke-dasharray="6 5"/>
<text x="943" y="290" class="small">DB</text>
<rect x="55" y="505" width="345" height="455" rx="18" fill="#fff8eb" stroke="#e6d8b7" stroke-width="2"/>
<text x="80" y="550" class="label">완료를 구분합니다</text>
<text x="80" y="596" class="body">① upstream 재사용</text><text x="80" y="627" class="small">소스·계약을 가져온 상태</text>
<text x="80" y="677" class="body">② Crewroom 검증</text><text x="80" y="708" class="small">변경별 test / UI / API 증거</text>
<text x="80" y="758" class="body">③ live 미검증</text><text x="80" y="789" class="small">실제 모델·GitLab·운영 환경</text>
<text x="80" y="839" class="body">④ 최종 완료 blocker</text><text x="80" y="870" class="small">독립 기억·provenance·격리</text><text x="80" y="901" class="small">exact publication·일관된 복구</text>
<rect x="55" y="1000" width="1490" height="110" rx="18" fill="#e8eef5"/>
<text x="80" y="1037" class="label">배포: EC2 한 대 · Docker Compose · PostgreSQL도 컨테이너</text>
<text x="80" y="1072" class="body">선택 TLS proxy → authenticated app + 지속 /paperclip volume → 내부망 PostgreSQL + 별도 DB volume</text>
<text x="80" y="1096" class="small">현재 지원 경로는 app 컨테이너 내부 CLI 실행. 별도 job 격리·EC2 배포 완료는 추가 구현/실환경 증거가 필요합니다.</text>
</svg>