name: Crewroom full regression

on:
  push:
    branches: [main, codex/crewroom-paperclip]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crewroom-full-${{ github.ref }}
  cancel-in-progress: true

env:
  PAPERCLIP_TELEMETRY_DISABLED: '1'
  HEARTBEAT_SCHEDULER_ENABLED: 'false'
  PAPERCLIP_VITEST_MAX_WORKERS: '2'
  PAPERCLIP_CI_PROFILE: 'true'
  PAPERCLIP_CI_PROFILE_DIR: ${{ github.workspace }}/.ci-profile

jobs:
  regression:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - name: general-server-without-chat-or-native-runner-1
            args: --mode general --group general-server-without-chat-or-native-runner --shard-index 0 --shard-count 8
          - name: general-server-without-chat-or-native-runner-2
            args: --mode general --group general-server-without-chat-or-native-runner --shard-index 1 --shard-count 8
          - name: general-server-without-chat-or-native-runner-3
            args: --mode general --group general-server-without-chat-or-native-runner --shard-index 2 --shard-count 8
          - name: general-server-without-chat-or-native-runner-4
            args: --mode general --group general-server-without-chat-or-native-runner --shard-index 3 --shard-count 8
          - name: general-server-without-chat-or-native-runner-5
            args: --mode general --group general-server-without-chat-or-native-runner --shard-index 4 --shard-count 8
          - name: general-server-without-chat-or-native-runner-6
            args: --mode general --group general-server-without-chat-or-native-runner --shard-index 5 --shard-count 8
          - name: general-server-without-chat-or-native-runner-7
            args: --mode general --group general-server-without-chat-or-native-runner --shard-index 6 --shard-count 8
          - name: general-server-without-chat-or-native-runner-8
            args: --mode general --group general-server-without-chat-or-native-runner --shard-index 7 --shard-count 8
          - name: serialized-1
            args: --mode serialized --shard-index 0 --shard-count 4
          - name: serialized-2
            args: --mode serialized --shard-index 1 --shard-count 4
          - name: serialized-3
            args: --mode serialized --shard-index 2 --shard-count 4
          - name: serialized-4
            args: --mode serialized --shard-index 3 --shard-count 4
          - name: general-chat-1
            args: --mode general --group general-chat --shard-index 0 --shard-count 4
          - name: general-chat-2
            args: --mode general --group general-chat --shard-index 1 --shard-count 4
          - name: general-chat-3
            args: --mode general --group general-chat --shard-index 2 --shard-count 4
          - name: general-chat-4
            args: --mode general --group general-chat --shard-index 3 --shard-count 4
          - name: general-workspaces-a-1
            args: --mode general --group general-workspaces-a --shard-index 0 --shard-count 2
          - name: general-workspaces-a-2
            args: --mode general --group general-workspaces-a --shard-index 1 --shard-count 2
          - name: general-workspaces-b-1
            args: --mode general --group general-workspaces-b
          - name: general-workspaces-c-1
            args: --mode general --group general-workspaces-c
          - name: general-server-native-runner-1
            args: --mode general --group general-server-native-runner
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install pinned Runner Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.2, preserved upstream pin
        with:
          workspaces: packages/paperclip-runner/runner -> target
          shared-key: crewroom-runner-v1
          cache-workspace-crates: false
          cache-bin: false
          save-if: ${{ github.event_name == 'push' }}
      - run: pnpm preflight:workspace-links
      - run: pnpm --filter @paperclipai/plugin-sdk ensure-build-deps
      - name: Execute complete shard and preserve its exit status
        shell: bash
        env:
          PAPERCLIP_CI_PROFILE_JOB: ${{ matrix.name }}
        run: |
          set -o pipefail
          mkdir -p .ci-profile
          node scripts/run-vitest-stable.mjs ${{ matrix.args }} 2>&1 | tee .ci-profile/console.log
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7, preserved upstream pin
        with:
          name: crewroom-${{ matrix.name }}-${{ github.run_attempt }}
          path: .ci-profile/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
