name: Crewroom

on:
  push:
    branches: [main, codex/crewroom-paperclip]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crewroom-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PAPERCLIP_TELEMETRY_DISABLED: '1'
  HEARTBEAT_SCHEDULER_ENABLED: 'false'

jobs:
  contracts:
    name: Module, token and source contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:module-boundaries
      - run: pnpm check:token-gates
      - run: node scripts/check-maps.mjs
      - run: pnpm check:no-git-push

  focused:
    name: Crewroom, privacy and task feedback regressions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm preflight:workspace-links
      - run: pnpm --filter @paperclipai/plugin-sdk ensure-build-deps
      - name: Deployment readiness and diagnostic privacy contracts
        run: |
          python3 -m unittest deploy/crewroom/diagnostics_test.py
          node --test --test-concurrency=1 scripts/__tests__/crewroom-deploy-readiness.test.mjs
      - name: Require working Linux user and PID namespaces
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          if ! test -x /usr/bin/bwrap; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends bubblewrap
          fi
          test -x /usr/bin/python3
          args=(--die-with-parent --unshare-all --cap-drop ALL --ro-bind /usr /usr --ro-bind /bin /bin --ro-bind /lib /lib)
          if test -d /lib64; then args+=(--ro-bind /lib64 /lib64); fi
          args+=(--proc /proc --dev /dev --chdir / -- /bin/true)
          /usr/bin/bwrap "${args[@]}"
      - name: Server conversation, capability and privacy contracts
        run: >-
          pnpm exec vitest run --project @paperclipai/server --maxWorkers=2
          server/src/__tests__/agent-conversations.test.ts
          server/src/__tests__/crewroom-capabilities.test.ts
          server/src/__tests__/issue-comment-reopen-routes.test.ts
          server/src/__tests__/issue-closed-workspace-routes.test.ts
          server/src/__tests__/issue-feedback-routes.test.ts
          server/src/__tests__/heartbeat-run-privacy-routes.test.ts
          server/src/services/native-runtime/runner-bridge-tools.test.ts
      - name: Legacy dependency transformer compatibility
        run: node --test --test-concurrency=1 scripts/__tests__/crewroom-dependency-runtime.test.mjs
      - name: Patched dependency runtime contracts
        run: >-
          pnpm exec vitest run --maxWorkers=2
          server/src/__tests__/better-auth-credential-signup.integration.test.ts
          server/src/__tests__/express5-auth-wildcard.test.ts
          server/src/__tests__/assets.test.ts
          server/src/__tests__/agentmail-api.test.ts
          packages/adapters/cursor-cloud/src/server/execute.test.ts
          packages/adapters/cursor-cloud/src/server/session.test.ts
          packages/adapters/cursor-cloud/src/server/sdk-runtime.test.ts
          packages/adapters/cursor-cloud/src/ui/build-config.test.ts
          packages/adapters/cursor-cloud/src/ui/parse-stdout.test.ts
          packages/shared/src/validators/asset.test.ts
          ui/src/components/MarkdownBody.test.tsx
          ui/src/lib/mermaid-runtime.test.ts
      - name: Verify real Linux descendant reaping and controller death
        run: node server/scripts/verify-workspace-supervisor.mjs
      - name: MCP explicit comment intent regression
        working-directory: packages/mcp-server
        run: pnpm exec vitest run --maxWorkers=1 src/tools.test.ts
      - name: UI state, navigation and private conversation regressions
        run: >-
          pnpm exec vitest run --project @paperclipai/ui --maxWorkers=2
          ui/src/lib/crewroom.test.ts
          ui/src/api/heartbeats.crewroom.test.ts
          ui/src/components/crewroom/work-scene.test.ts
          ui/src/hooks/useAgentChatNavigation.test.tsx
          ui/src/components/AgentAvatar.test.tsx
          ui/src/components/Sidebar.test.tsx
          ui/src/components/Sidebar.crewroom.test.tsx
          ui/src/pages/AgentDetailPage.test.tsx
          ui/src/components/IssueChatThread.test.tsx
          ui/src/components/TaskChatThread.test.tsx
          ui/src/components/task-chat/TaskChatComposer.test.tsx
          ui/src/components/BreadcrumbBar.test.tsx
          ui/src/context/BreadcrumbContext.test.tsx
          ui/src/pages/AgentChat.test.tsx
          ui/src/pages/AgentChats.test.tsx
          ui/src/components/SidebarAgentChats.test.tsx
          ui/src/components/AgentChatPicker.test.tsx

  build:
    name: Workspace typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install repository Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt
      - run: pnpm preflight:workspace-links
      - run: pnpm --filter @paperclipai/plugin-sdk ensure-build-deps
      - run: pnpm typecheck
      - run: pnpm build
